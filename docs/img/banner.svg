<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Noir Roulette — случайный анонимный видео-чат">
  <title>Noir Roulette — случайный анонимный видео-чат</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ff3e"/>
      <stop offset="1" stop-color="#9fc900"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0" r="0.8">
      <stop offset="0" stop-color="#d8ff3e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d8ff3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#5a5adc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5a5adc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262e"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#08080a"/>
  <rect width="1200" height="400" fill="url(#glowA)"/>
  <rect width="1200" height="400" fill="url(#glowB)"/>

  <!-- Сетка на фоне, как в интерфейсе. -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60 H1200 M0 140 H1200 M0 220 H1200 M0 300 H1200 M0 380 H1200"/>
    <path d="M100 0 V400 M280 0 V400 M460 0 V400 M640 0 V400 M820 0 V400 M1000 0 V400 M1180 0 V400"/>
  </g>

  <!-- Слева: логотип, вписанный в рамку. -->
  <g transform="translate(84,112)">
    <rect x="0" y="0" width="176" height="176" rx="40" fill="url(#metal)" stroke="#d8ff3e" stroke-opacity="0.4"/>
    <circle cx="88" cy="88" r="62" fill="none" stroke="url(#accent)" stroke-width="6"
            stroke-dasharray="9 13" stroke-linecap="round"/>
    <circle cx="88" cy="88" r="31" fill="#08080a" stroke="#d8ff3e" stroke-width="5"/>
    <circle cx="88" cy="88" r="13" fill="url(#accent)"/>
    <path d="M88 14 L104 38 L72 38 Z" fill="#d8ff3e"/>
  </g>

  <!-- Справа: название и подпись. -->
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="316" y="172" font-size="76" font-weight="800" fill="#f2f1f4" letter-spacing="-2">
      Noir<tspan fill="#d8ff3e"> Roulette</tspan>
    </text>
    <text x="318" y="222" font-size="25" fill="#a3a1ad">
      Случайный анонимный видео-чат с незнакомцем
    </text>

    <!-- Три пилюли с ключевыми обещаниями продукта. -->
    <g font-size="17" fill="#f2f1f4">
      <rect x="318" y="252" width="196" height="42" rx="21" fill="#d8ff3e" fill-opacity="0.12" stroke="#d8ff3e" stroke-opacity="0.4"/>
      <text x="342" y="279">Без регистрации</text>

      <rect x="528" y="252" width="230" height="42" rx="21" fill="#d8ff3e" fill-opacity="0.12" stroke="#d8ff3e" stroke-opacity="0.4"/>
      <text x="552" y="279">Подбор по интересам</text>

      <rect x="772" y="252" width="228" height="42" rx="21" fill="#d8ff3e" fill-opacity="0.12" stroke="#d8ff3e" stroke-opacity="0.4"/>
      <text x="796" y="279">Комнаты и чат</text>
    </g>
  </g>
</svg>